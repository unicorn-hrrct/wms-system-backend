# ===== Application =====
spring.application.name=demo
server.port=8080

# ===== Datasource: PostgreSQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo_db}
spring.datasource.username=${DB_USERNAME:demo}
spring.datasource.password=${DB_PASSWORD:demo_pwd_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== MyBatis-Plus =====
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ===== JWT =====
app.jwt.secret=springboot-demo-wms-jwt-secret-change-me-2026
app.jwt.expire-seconds=86400

# ===== SQL initialization =====
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ===== Redis / Redisson =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:wms2026}
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=3s
spring.cache.type=redis

# ===== RabbitMQ =====
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:wms}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:wms2026}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms

# ===== Business =====
app.stock.lock-wait-millis=${STOCK_LOCK_WAIT_MILLIS:3000}
app.stock.lock-lease-millis=${STOCK_LOCK_LEASE_MILLIS:10000}
app.order.idempotency-seconds=${ORDER_IDEMPOTENCY_SECONDS:86400}
app.outbox.publish-delay-millis=${OUTBOX_PUBLISH_DELAY_MILLIS:1000}
app.outbox.enabled=${OUTBOX_ENABLED:true}
# v1.2 内部服务调用 token（各服务共享此密钥）
app.service.token=${SERVICE_TOKEN:change-me-2026}
# v1.2 Mock 支付回调签名校验
app.payment.mock.secret=${PAYMENT_MOCK_SECRET:mock-pay-secret-2026}
app.payment.mock.timestamp-skew-seconds=${PAYMENT_MOCK_SKEW:300}
# v1.2 库存预占过期扫描
app.stock-reservation.expire-scan-delay-millis=${STOCK_RESERVATION_SCAN_DELAY:60000}
# v1.2 大屏实时推送（WebSocket 暂以内存占位）
app.dashboard.screen-refresh-millis=${DASHBOARD_REFRESH:10000}
